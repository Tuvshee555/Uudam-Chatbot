name: Live conversation replay (manual, approved runs only)

# Customer journeys through the real webhook with the live catalogue (read-only) and a real model.
# It SPENDS MODEL CREDIT, so it never runs on a schedule or on pull requests: an owner starts it by
# hand and confirms. Routine CI (ci.yml) runs the same journeys on mocked model responses.
# Needs repository secrets LIVE_REPLAY_NEON_DATABASE_URL (a read-only database role) and
# LIVE_REPLAY_OPENAI_API_KEY: a key from a SEPARATE OpenAI project with its own budget limit,
# never the production key (scripts/lib/evalGuard.mjs refuses otherwise).

on:
  workflow_dispatch:
    inputs:
      approve:
        description: 'This run spends model credit (about 130 calls, roughly $4 at the cap). Type "yes" to approve.'
        required: true
        default: "no"
      max_model_calls:
        description: "Hard cap on model calls for this run"
        required: true
        default: "150"

jobs:
  replay:
    if: github.event.inputs.approve == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.LIVE_REPLAY_NEON_DATABASE_URL }}
      EVAL_OPENAI_API_KEY: ${{ secrets.LIVE_REPLAY_OPENAI_API_KEY }}
      EVAL_RUN_APPROVED: "1"
      EVAL_MAX_MODEL_CALLS: ${{ github.event.inputs.max_model_calls }}
      VERIFY_TOKEN: ci-verify-token
      FACEBOOK_PAGES: "000000000000000:ci-not-a-real-token"
      META_APP_SECRET: ci-meta-secret
      ADMIN_SECRET: ci-admin-secret
      REDIS_STATE_ENABLED: "false"
      REDIS_RATE_LIMIT_ENABLED: "false"
      REDIS_REPLAY_ENABLED: "false"
      REDIS_CONVERSATION_ENABLED: "false"
      REDIS_PAUSE_ENABLED: "false"
    steps:
      - name: Require secrets
        if: env.NEON_DATABASE_URL == '' || env.EVAL_OPENAI_API_KEY == ''
        run: |
          echo "::error::Add LIVE_REPLAY_NEON_DATABASE_URL and LIVE_REPLAY_OPENAI_API_KEY (separate project key) secrets first."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Replay customer journeys
        run: npm run qa:live
